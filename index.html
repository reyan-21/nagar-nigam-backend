<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nagar Nigam App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        input, button { width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #007BFF; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .hidden { display: none; }
        #locationText { font-size: 14px; color: green; font-weight: bold; }
        .auth-container { max-width: 400px; margin: 50px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <!-- 1. LOGIN & SIGNUP BOX -->
    <div class="auth-container" id="auth-box">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <h2>Nagar Nigam Login</h2>
            <input type="email" id="login-email" placeholder="Email (Jaise: user@gmail.com)">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="loginUser('user')">Login</button>
            <p style="margin-top: 15px; font-size: 14px; text-align: center;">
                Naya account banayein? <a href="#" onclick="toggleForm()" style="color: blue;">Sign Up</a>
            </p>
        </div>

        <!-- SIGNUP SECTION -->
        <div id="signup-section" style="display: none;">
            <h2>Nagar Nigam Sign Up</h2>
            <input type="email" id="signup-email" placeholder="Email (Jaise: user@gmail.com)">
            <input type="password" id="signup-password" placeholder="Naya Password">
            <button onclick="signupUser('user')">Sign Up</button>
            <p style="margin-top: 15px; font-size: 14px; text-align: center;">
                Pehle se account hai? <a href="#" onclick="toggleForm()" style="color: blue;">Login</a>
            </p>
        </div>
    </div>

    <!-- 2. MAIN COMPLAINT SCREEN (Login ke baad dikhegi) -->
    <div id="complaintScreen" class="card hidden">
        <h2>Nayi Complaint Darj Karein</h2>
        
        <label>Problem ki Category:</label>
        <input type="text" id="category" placeholder="Jaise: Gaddha, Kachra, Pani" value="Gaddha">
        
        <!-- Live GPS Location -->
        <button onclick="getLiveLocation()" style="background: #28a745;">📍 Get Live Location</button>
        <p id="locationText">Location: Abhi set nahi hai</p>

        <!-- Camera / File Upload -->
        <label>Photo Upload Karein:</label>
        <input type="file" id="imageFile" accept="image/*" capture="environment">

        <button onclick="submitComplaint()">🚀 Submit Complaint</button>
    </div>

    <!-- ⚙️ JavaScript Logic -->
    <script>
        const BASE_URL = "https://nagar-nigam-api-live.onrender.com/api";
        let currentUserId = null;
        let lat = null;
        let lng = null;
        
        function toggleForm() {
            const loginSec = document.getElementById("login-section");
            const signupSec = document.getElementById("signup-section");
            
            if (loginSec.style.display === "none") {
                loginSec.style.display = "block";
                signupSec.style.display = "none";
            } else {
                loginSec.style.display = "none";
                signupSec.style.display = "block";
            }
        }

        async function signupUser(roleType) {
            const email = document.getElementById("signup-email").value;
            const password = document.getElementById("signup-password").value;

            const response = await fetch(`${BASE_URL}/signup`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password, role: roleType })
            });

            const data = await response.json();
            if (response.ok) {
                alert("Account ban gaya! Ab login karein.");
                toggleForm(); 
            } else {
                alert("Error: " + data.detail);
            }
        }

        async function loginUser(roleType) {
            const email = document.getElementById("login-email").value;
            const password = document.getElementById("login-password").value;

            const response = await fetch(`${BASE_URL}/login/${roleType}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email: email, password: password })
            });

            const data = await response.json();
            if (response.ok) {
                alert("Login Success!");
                
                // DATA SAVE: Backend se aayi user_id ko complaint ke liye save kiya
                currentUserId = data.user_id; 
                
                // SCREEN CHANGE: Login form chupao aur Complaint Form dikhao
                document.getElementById("auth-box").style.display = "none"; 
                document.getElementById("complaintScreen").classList.remove("hidden");
            } else {
                alert("Error: " + data.detail);
            }
        }

        function getLiveLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        lat = position.coords.latitude;
                        lng = position.coords.longitude;
                        document.getElementById('locationText').innerText = `Location Saved: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    },
                    (error) => {
                        alert("Please allow Location permission!");
                    }
                );
            } else {
                alert("Aapka browser GPS support nahi karta.");
            }
        }

        async function submitComplaint() {
            const category = document.getElementById('category').value;
            const fileInput = document.getElementById('imageFile');

            if (!lat || !lng) {
                alert("Pehle 'Get Live Location' button par click karke location save karein!");
                return;
            }
            if (fileInput.files.length === 0) {
                alert("Kripya problem ki ek photo select karein!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("file", file);

            try {
                const submitBtn = document.querySelector("button[onclick='submitComplaint()']");
                submitBtn.innerText = "⏳ Uploading Photo...";
                submitBtn.disabled = true;

                const uploadRes = await fetch(`${BASE_URL}/upload-image`, {
                    method: 'POST',
                    body: formData 
                });
                
                if (!uploadRes.ok) throw new Error("Photo upload fail ho gayi.");
                
                const uploadData = await uploadRes.json();
                const imageUrl = uploadData.url;

                submitBtn.innerText = "⏳ Saving Complaint...";
                const complaintData = {
                    user_id: currentUserId,
                    category: category,
                    latitude: lat,
                    longitude: lng,
                    user_image_url: imageUrl
                };

                const complaintRes = await fetch(`${BASE_URL}/complaints`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(complaintData)
                });
                
                const finalData = await complaintRes.json();

                if (complaintRes.ok) {
                    alert("✅ Success! " + finalData.message);
                    fileInput.value = "";
                    submitBtn.innerText = "🚀 Submit Complaint";
                    submitBtn.disabled = false;
                } else {
                    alert("Error: " + finalData.detail);
                }

            } catch (error) {
                alert("System error: " + error.message);
                document.querySelector("button[onclick='submitComplaint()']").innerText = "🚀 Submit Complaint";
                document.querySelector("button[onclick='submitComplaint()']").disabled = false;
            }
        }
    </script>
</body>
</html>
